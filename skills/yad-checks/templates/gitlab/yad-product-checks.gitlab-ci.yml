# yad-managed-include: yad-checks
# Pattern gates for the PRODUCT, as an INCLUDABLE fragment. Pulled into the Product's root
# .gitlab-ci.yml via:
#   include:
#     - local: '.gitlab/ci/yad-product-checks.yml'
# MRs run with `--profile product` and split by source branch: review/EP-* MRs are Shape artifact-
# review vehicles (a `review: <artifact> (EP-<slug>)` title + the Product artifact-review template body);
# every other MR is a tooling/code change to the Product itself and follows the code convention (a
# Conventional-Commits title + the code task template body). The source branch is passed via --head so
# the gate can tell the two apart. Commit subjects are always Conventional-Commits.
# Job names are yad-product-prefixed so they coexist with any code-repo fragment in one pipeline; jobs use
# `needs: []` and no `stage:` so a foreign `stages:` list can neither break nor reorder them.
#
# `image:`/`tags:` live on the .yad_product_mr_only anchor below — NOT a top-level `default:`. An included
# top-level `default:` merges into the HOST root pipeline: it would set this image and tag on every one of
# the Product's own jobs, and if the root already sets a top-level `image:`, GitLab rejects the whole
# config ("image is defined in top-level and 'default:' entry"). The anchor scopes them to these jobs.

#
# Gate scripts (#426): every job runs the BASE branch's copy of checks/, never the PR's own, so a PR that
# changes a gate script is still judged by the script already merged. A script the base does not have yet
# (the PR that first installs the gates, or a `yad update` that adds one) runs from the PR, with a note.
# The base's script runs with THIS file's call: keep every call one the previous release's script accepts.
# This file itself still comes from the PR: protect checks/ and the CI files with a CODEOWNERS rule and
# a required Code Owner review (docs/branch-protection.md, "Who may change the gates").
# #426: the base branch's copy of checks/ runs, never the MR's own (see the header). It is the first line of
# every job's script, not a before_script, so a `default: before_script` of the host pipeline still runs.
.yad_base_checks:
  script:
    - |
      YAD_BASE="$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"; YAD_CHECKS="$(mktemp -d)/checks"; export YAD_CHECKS
      (
        set -euo pipefail
        b="origin/${YAD_BASE}"; d="${YAD_CHECKS%/checks}"
        rm -rf "$d"; mkdir -p "$YAD_CHECKS"
        git rev-parse --verify --quiet "${b}^{commit}" > /dev/null || { echo "FAIL [base-checks]: ${b} is not in this checkout, so the gate scripts cannot be read from the base branch. Check the code out with its full history." >&2; exit 1; }
        t="$(git ls-tree "$b" checks)"
        case "$t" in
          "") on_base=0 ;;
          "040000 tree "*) git archive "$b" checks | tar -x -C "$d"; on_base=1 ;;
          *) echo "FAIL [base-checks]: checks on ${b} is not a folder, so the gate scripts cannot be read from it. Make checks/ a plain folder on the base branch." >&2; exit 1 ;;
        esac
        git ls-tree -z HEAD checks/ > "$d/.pr"
        n=0
        while IFS= read -r -d '' e; do
          m="${e%% *}"; p="${e#*$'\t'}"; o="${e#* * }"; o="${o%%$'\t'*}"; s="${p//[$'\001'-$'\037']/?}"
          if [ -e "$d/$p" ] || [ -L "$d/$p" ]; then continue; fi
          case "$m" in
            100644 | 100755) git cat-file blob "$o" > "$d/$p"; if [ "$m" = 100755 ]; then chmod +x "$d/$p"; fi ;;
            *) printf 'note: %s in this PR is not a plain file, so it is not run (#426)\n' "$s"; continue ;;
          esac
          n=$((n + 1))
          if [ "$on_base" = 1 ]; then printf 'note: %s is not on %s yet, so the copy from this PR runs (#426)\n' "$s" "$YAD_BASE"; fi
        done < "$d/.pr"
        rm -f "$d/.pr"
        if [ "$n" = 1 ]; then w="1 file"; else w="$n files"; fi
        if [ "$on_base" = 0 ]; then printf 'note: %s has no checks/ folder yet, so the gate scripts from this PR run: %s (#426)\n' "$YAD_BASE" "$w"; fi
      )

.yad_product_mr_only:
  image: node:${YAD_NODE_VERSION}
  variables:
    # A project/group CI/CD variable overrides this YAML value, so the Node line can be changed in project
    # settings without editing the managed fragment (a current 22 or 24 line). A shell-executor runner
    # ignores `image:` — Node must then be on the runner host's PATH, and this value has no effect.
    YAD_NODE_VERSION: "22"
  # Runner selection: set the YAD_RUNNER_TAGS CI/CD variable (e.g. `dind_runner`) to route these jobs on
  # instances whose runners are tag-locked (run_untagged: false) — it lives in project Settings → CI/CD →
  # Variables, so it survives every `yad` sync. When unset, current GitLab (>=15) runs the jobs untagged;
  # older versions may strand them — set a real tag if so. Single value only: `tags: [$VAR]` is one tag.
  tags: [$YAD_RUNNER_TAGS]
  timeout: 10 minutes # a stuck job stops here, not at the project default (#424)
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

variables:
  GIT_DEPTH: "0"   # full history so the commit gate can diff against the target branch

yad-product-commit-message:
  extends: .yad_product_mr_only
  needs: []
  script:
    - !reference [.yad_base_checks, script]
    - bash "$YAD_CHECKS/commit-message.sh" --profile product "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"

# GIT_DEPTH: 0 (above) gives the changed paths, so the gate can reject an artifact change (epics/**)
# riding a non-review source branch past the Shape review with a plain code title/template.
yad-product-pr-title:
  extends: .yad_product_mr_only
  needs: []
  script:
    - !reference [.yad_base_checks, script]
    - changed="$(mktemp)"; git -c core.quotePath=false diff --no-renames --name-only "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME...HEAD" > "$changed"
    - bash "$YAD_CHECKS/pr-title.sh" --profile product --head "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" --changed "$changed" "$CI_MERGE_REQUEST_TITLE"

yad-product-pr-template:
  extends: .yad_product_mr_only
  needs: []
  script:
    - !reference [.yad_base_checks, script]
    - changed="$(mktemp)"; git -c core.quotePath=false diff --no-renames --name-only "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME...HEAD" > "$changed"
    - body="$(mktemp)"; printf '%s' "$CI_MERGE_REQUEST_DESCRIPTION" > "$body"
    - bash "$YAD_CHECKS/pr-template.sh" --profile product --head "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" --changed "$changed" "$body"

# The gate ledger is CI-owned: reject non-bot commits to .sdlc/{state,approvals,comments,product-prs,hub-prs}.json
# or reviews/*.md (.sdlc/contract-lock.json is artifact-side and allowed). The one other exception is a
# brand-new epic's seed, which no CI path can write, so it rides this first review MR (#162).
yad-product-ledger-guard:
  extends: .yad_product_mr_only
  needs: []
  script:
    - !reference [.yad_base_checks, script]
    - bash "$YAD_CHECKS/ledger-guard.sh" "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"

# E131: a member file (.sdlc/members/) is changed only by the MR's own author. GitLab's predefined
# variables do not name the MR author, so the check reads it from the API with GITLAB_TOKEN or SDLC_API_TOKEN
# (a masked CI/CD variable) — and FAILS when a member file changed and no token is set.
yad-product-member-check:
  extends: .yad_product_mr_only
  needs: []
  script:
    - !reference [.yad_base_checks, script]
    - node "$YAD_CHECKS/member-check.mjs" "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
