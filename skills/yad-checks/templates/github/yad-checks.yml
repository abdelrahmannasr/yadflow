      - run: bash "$YAD_CHECKS/reconcile-debt-check.sh" "origin/${{ github.base_ref }}"

  # Pattern gate: every commit subject follows the convention (profile: code). The PR title and body are
  # checked by yad-pr-text.yml.
  commit-message:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
