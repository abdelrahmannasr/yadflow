      YAD_NODE_VERSION: ${{ vars.YAD_NODE_VERSION || '22' }} # repo variable; a current 22 or 24 line (Node 25+ has no Corepack; 18 and 20 are end of life)
      NX_BASE: ${{ github.event.pull_request.base.sha }}
      NX_HEAD: ${{ github.event.pull_request.head.sha }}
      COREPACK_HOME: ${{ github.workspace }}/.corepack-cache # pinned-manager downloads, cached below
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # No `filter: blob:none` (#426): the next step reads the base's checks/, which a
          # partial clone leaves out when the PR changed them, and with no credentials kept it
          # could not fetch them.
          persist-credentials: false
      - name: Gate scripts from the base branch (#426)
        env: { YAD_BASE: "${{ github.base_ref }}" }
        run: |
          YAD_CHECKS="$RUNNER_TEMP/yad-base-checks/checks"
