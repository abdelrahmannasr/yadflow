# yad-managed: yad-checks
# Gates for the PRODUCT's PRs: commit subjects (Conventional Commits, `--profile product`), the CI-owned
# gate ledger, and member files. The PR title and body are checked by yad-product-pr-text.yml (#425).
# Standalone workflow so it never collides with the code-repo yad-checks workflow.
#
# Gate scripts (#426): every job runs the BASE branch's copy of checks/, never the PR's own, so a PR that
# changes a gate script is still judged by the script already merged. A script the base does not have yet
# (the PR that first installs the gates, or a `yad update` that adds one) runs from the PR, with a note.
# The base's script runs with THIS file's call: keep every call one the previous release's script accepts.
# This file itself still comes from the PR: protect checks/ and the yad CI files with a CODEOWNERS rule and
# a required Code Owner review (docs/branch-protection.md, "Who may change the gates").
name: yad-product-checks
on:
  pull_request:
    # Never `edited` (#425). A job skipped by `if:` counts as passed, so a run started by an edit of the PR
    # text would show every gate here as passed on the same commit — a failed gate could turn green. The two
    # checks that read the PR text, pr-title and pr-template, run from yad-product-pr-text.yml, which does
    # start on an edit.
    types: [opened, synchronize, reopened]
    branches: ["**"]

# Read-only by default: no gate here writes to the repo. A job that needs more asks for it itself.
permissions:
  contents: read

jobs:
  # commit-message reads the commit range. The PR title and body are checked by yad-product-pr-text.yml.
  commit-message:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Gate scripts from the base branch (#426)
        env: { YAD_BASE: "${{ github.base_ref }}" }
        run: |
          YAD_CHECKS="$RUNNER_TEMP/yad-base-checks/checks"
          (
            set -euo pipefail
            b="origin/${YAD_BASE}"; d="${YAD_CHECKS%/checks}"
            rm -rf "$d"; mkdir -p "$YAD_CHECKS"
            git rev-parse --verify --quiet "${b}^{commit}" > /dev/null || { echo "FAIL [base-checks]: ${b} is not in this checkout, so the gate scripts cannot be read from the base branch. Check the code out with its full history." >&2; exit 1; }
            t="$(git ls-tree "$b" checks)"
            case "$t" in "040000 tree "*) git archive "$b" checks | tar -x -C "$d"; on_base=1 ;; *) on_base=0 ;; esac
            git ls-tree -z HEAD checks/ > "$d/.pr"
            n=0
            while IFS= read -r -d '' e; do
              m="${e%% *}"; p="${e#*$'\t'}"; o="${e#* * }"; o="${o%%$'\t'*}"
              if [ -e "$d/$p" ] || [ -L "$d/$p" ]; then continue; fi
              case "$m" in
                100644 | 100755) git cat-file blob "$o" > "$d/$p"; if [ "$m" = 100755 ]; then chmod +x "$d/$p"; fi ;;
                *) printf 'note: %s in this PR is not a plain file, so it is not run (#426)\n' "$p"; continue ;;
              esac
              n=$((n + 1))
              if [ "$on_base" = 1 ]; then printf 'note: %s is not on %s yet, so the copy from this PR runs (#426)\n' "$p" "$YAD_BASE"; fi
            done < "$d/.pr"
            rm -f "$d/.pr"
            if [ "$on_base" = 0 ]; then printf 'note: %s has no checks/ folder yet, so the gate scripts from this PR run: %s files (#426)\n' "$YAD_BASE" "$n"; fi
          )
          echo "YAD_CHECKS=$YAD_CHECKS" >> "$GITHUB_ENV"
      - run: bash "$YAD_CHECKS/commit-message.sh" --profile product "origin/${{ github.base_ref }}"

  # The gate ledger is CI-owned: reject non-bot commits to .sdlc/{state,approvals,comments,product-prs,hub-prs}.json
  # or reviews/*.md (.sdlc/contract-lock.json is artifact-side and allowed). The one other exception is a
  # brand-new epic's seed, which no CI path can write, so it rides this first review PR (#162).
  ledger-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Gate scripts from the base branch (#426)
        env: { YAD_BASE: "${{ github.base_ref }}" }
        run: |
          YAD_CHECKS="$RUNNER_TEMP/yad-base-checks/checks"
          (
            set -euo pipefail
            b="origin/${YAD_BASE}"; d="${YAD_CHECKS%/checks}"
            rm -rf "$d"; mkdir -p "$YAD_CHECKS"
            git rev-parse --verify --quiet "${b}^{commit}" > /dev/null || { echo "FAIL [base-checks]: ${b} is not in this checkout, so the gate scripts cannot be read from the base branch. Check the code out with its full history." >&2; exit 1; }
            t="$(git ls-tree "$b" checks)"
            case "$t" in "040000 tree "*) git archive "$b" checks | tar -x -C "$d"; on_base=1 ;; *) on_base=0 ;; esac
            git ls-tree -z HEAD checks/ > "$d/.pr"
            n=0
            while IFS= read -r -d '' e; do
              m="${e%% *}"; p="${e#*$'\t'}"; o="${e#* * }"; o="${o%%$'\t'*}"
              if [ -e "$d/$p" ] || [ -L "$d/$p" ]; then continue; fi
              case "$m" in
                100644 | 100755) git cat-file blob "$o" > "$d/$p"; if [ "$m" = 100755 ]; then chmod +x "$d/$p"; fi ;;
                *) printf 'note: %s in this PR is not a plain file, so it is not run (#426)\n' "$p"; continue ;;
              esac
              n=$((n + 1))
              if [ "$on_base" = 1 ]; then printf 'note: %s is not on %s yet, so the copy from this PR runs (#426)\n' "$p" "$YAD_BASE"; fi
            done < "$d/.pr"
            rm -f "$d/.pr"
            if [ "$on_base" = 0 ]; then printf 'note: %s has no checks/ folder yet, so the gate scripts from this PR run: %s files (#426)\n' "$YAD_BASE" "$n"; fi
          )
          echo "YAD_CHECKS=$YAD_CHECKS" >> "$GITHUB_ENV"
      - run: bash "$YAD_CHECKS/ledger-guard.sh" "origin/${{ github.base_ref }}"

  # E131: a member file (.sdlc/members/) is changed only by its own person, and every email it adds must be
  # the author of a commit in this PR that GitHub attributes to that person. Needs a read token to ask
  # GitHub who a commit belongs to; the PR author comes from the event, never from the PR's own files.
  member-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Gate scripts from the base branch (#426)
        env: { YAD_BASE: "${{ github.base_ref }}" }
        run: |
          YAD_CHECKS="$RUNNER_TEMP/yad-base-checks/checks"
          (
            set -euo pipefail
            b="origin/${YAD_BASE}"; d="${YAD_CHECKS%/checks}"
            rm -rf "$d"; mkdir -p "$YAD_CHECKS"
            git rev-parse --verify --quiet "${b}^{commit}" > /dev/null || { echo "FAIL [base-checks]: ${b} is not in this checkout, so the gate scripts cannot be read from the base branch. Check the code out with its full history." >&2; exit 1; }
            t="$(git ls-tree "$b" checks)"
            case "$t" in "040000 tree "*) git archive "$b" checks | tar -x -C "$d"; on_base=1 ;; *) on_base=0 ;; esac
            git ls-tree -z HEAD checks/ > "$d/.pr"
            n=0
            while IFS= read -r -d '' e; do
              m="${e%% *}"; p="${e#*$'\t'}"; o="${e#* * }"; o="${o%%$'\t'*}"
              if [ -e "$d/$p" ] || [ -L "$d/$p" ]; then continue; fi
              case "$m" in
                100644 | 100755) git cat-file blob "$o" > "$d/$p"; if [ "$m" = 100755 ]; then chmod +x "$d/$p"; fi ;;
                *) printf 'note: %s in this PR is not a plain file, so it is not run (#426)\n' "$p"; continue ;;
              esac
              n=$((n + 1))
              if [ "$on_base" = 1 ]; then printf 'note: %s is not on %s yet, so the copy from this PR runs (#426)\n' "$p" "$YAD_BASE"; fi
            done < "$d/.pr"
            rm -f "$d/.pr"
            if [ "$on_base" = 0 ]; then printf 'note: %s has no checks/ folder yet, so the gate scripts from this PR run: %s files (#426)\n' "$YAD_BASE" "$n"; fi
          )
          echo "YAD_CHECKS=$YAD_CHECKS" >> "$GITHUB_ENV"
      - run: node "$YAD_CHECKS/member-check.mjs" "origin/${{ github.base_ref }}"
