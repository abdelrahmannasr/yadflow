# yad-managed: yad-checks
# Pattern gates for the PRODUCT. They run with `--profile product` and split by head branch:
#   review/EP-* PRs are Shape artifact-review vehicles — a `review: <artifact> (EP-<slug>)` title
#     and the Product artifact-review template body.
#   every other PR is a tooling/code change to the Product itself — a Conventional-Commits title and the
#     code task template body (same convention the code repos use).
# The head ref is passed via --head so the gate can tell the two apart. Commit subjects are always
# Conventional-Commits. Standalone workflow so it never collides with the code-repo yad-checks workflow.
name: yad-product-checks
on:
  pull_request:
    # `edited` (beyond the opened/synchronize/reopened defaults) so a PR title/body correction
    # re-runs the pattern gates without a close/reopen — e.g. fixing a body the pr-template gate held.
    types: [opened, synchronize, reopened, edited]
    branches: ["**"]

# Read-only by default: no gate here writes to the repo. A job that needs more asks for it itself.
permissions:
  contents: read

jobs:
  # commit-message + ledger-guard read the commit range, not the PR title/body — skip them on a bare
  # `edited` event (only pr-title/pr-template need to re-check a title/body fix).
  commit-message:
    runs-on: ubuntu-latest
    if: github.event.action != 'edited'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - run: bash checks/commit-message.sh --profile product "origin/${{ github.base_ref }}"

  # Pass the title via env (never interpolate untrusted ${{ }} into a run line — injection-safe).
  # fetch-depth: 0 + the base ref give us the PR's changed paths, so the gate can reject an artifact
  # change (epics/**) riding a non-review head past the Shape review with a plain code title.
  pr-title:
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_HEAD: ${{ github.event.pull_request.head.ref }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - run: |
          changed="$(mktemp)"; git -c core.quotePath=false diff --no-renames --name-only "origin/${BASE_REF}...HEAD" > "$changed"
          bash checks/pr-title.sh --profile product --head "$PR_HEAD" --changed "$changed" "$PR_TITLE"

  pr-template:
    runs-on: ubuntu-latest
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_HEAD: ${{ github.event.pull_request.head.ref }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - run: |
          changed="$(mktemp)"; git -c core.quotePath=false diff --no-renames --name-only "origin/${BASE_REF}...HEAD" > "$changed"
          body="$(mktemp)"; printf '%s' "$PR_BODY" > "$body"
          bash checks/pr-template.sh --profile product --head "$PR_HEAD" --changed "$changed" "$body"

  # The gate ledger is CI-owned: reject non-bot commits to .sdlc/{state,approvals,comments,product-prs,hub-prs}.json
  # or reviews/*.md (.sdlc/contract-lock.json is artifact-side and allowed). The one other exception is a
  # brand-new epic's seed, which no CI path can write, so it rides this first review PR (#162).
  ledger-guard:
    runs-on: ubuntu-latest
    if: github.event.action != 'edited'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - run: bash checks/ledger-guard.sh "origin/${{ github.base_ref }}"
