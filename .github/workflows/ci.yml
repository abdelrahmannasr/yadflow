name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [18, 20, 22]
        # One macOS leg (Node 22) confirms the bash gates + git plumbing behave on the
        # other POSIX target without paying for a full os×node cross-product.
        include:
          - os: macos-latest
            node-version: 22
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      # Bug net, not a style check (no formatter) — runs once on the canonical leg.
      - name: Lint
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        run: npm run lint

      - name: Test
        run: npm test

      # Threshold flags need Node >= 22.8 — gate on the 22 leg only. Floors, not targets:
      # raise them as coverage grows, never lower them to make a change pass.
      - name: Coverage gate (lines >= 70%, branches >= 70%)
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        run: npm run coverage

      - name: Pack smoke (tarball contents)
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        run: |
          files=$(npm pack --dry-run --json | node -e "const f=JSON.parse(require('fs').readFileSync(0)).flatMap(x=>x.files.map(y=>y.path)); console.log(f.join('\n'))")
          echo "$files"
          for leak in .sdlc/ demo-repos/ epics/ cli/test.mjs cli/test-checks.mjs cli/test-threads.mjs cli/test-golden.mjs cli/test-migrate.mjs cli/test-hooks.mjs cli/fixtures/; do
            # Escape regex metachars so the prefix match is literal (".sdlc/" must not match "asdlc/").
            if echo "$files" | grep -q "^${leak//./\\.}"; then echo "::error::tarball leaks $leak"; exit 1; fi
          done
          echo "$files" | grep -q '^bin/yad.mjs' || { echo "::error::bin missing"; exit 1; }
          echo "$files" | grep -q '^skills/' || { echo "::error::skills missing"; exit 1; }

  # Native Windows, no WSL (E113). Not the full suite: it drives bash gates and POSIX paths throughout.
  # This runs the file written for every OS — the Node hook scripts, run as `node hooks/<script>.mjs` the
  # way Claude Code and Cursor run them, and the Windows-facing CLI (CRLF checkouts, `.cmd` launchers,
  # `C:\` and `/c:/` paths, Git Bash detection). The checkout keeps the runner's default
  # `core.autocrlf=true`, so the scripts under test have CRLF line endings, as on a teammate's machine.
  windows:
    name: windows (hooks + CLI, node ${{ matrix.node-version }})
    runs-on: windows-latest
    strategy:
      matrix:
        # 18 is the oldest Node yadflow supports; 22 is current.
        node-version: [18, 22]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Hook scripts and the Windows-facing CLI
        run: node --test cli/test-hooks.mjs

  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Packs the real tarball, installs it into a throwaway prefix, and drives the installed
      # binary through setup -> check -> gate open/sync -> commit -> check gates (pass + fail).
      - name: E2E against the packed tarball
        run: npm run test:e2e

  audit:
    name: audit (dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # The runtime has ZERO production dependencies — this proves it stays that way.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify registry signatures
        run: npm audit signatures
