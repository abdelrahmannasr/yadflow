name: CI

on:
  push:
    branches: [main]
  # Every PR, whatever its base: a stacked PR (based on another PR's branch) got no CI run before,
  # and GitHub does not re-run it when the base later moves to main (#534).
  pull_request:
  # Nightly, and by hand (#434): the macOS legs run on these and on pushes to main, not on pull requests. The
  # nightly run repeats every job, so `npm audit` also catches an advisory published since the last merge.
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

# A newer push to the same pull request cancels its older run (#428). A push to main never cancels or waits:
# each merge's run is the record that main was green at that commit, so its group is its event and commit (a
# shared group would still cancel a run left waiting in it, even without cancel-in-progress); with the event in
# it, a nightly or by-hand run of the same commit never waits behind its push run (#434).
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest]
        # 24 is the line we build and release on; 22 is the other supported LTS. 18 and 20 are end of life
        # (no security fixes): they stay as test-only legs, so 4.x keeps proving it still runs there, and
        # leave in yadflow 5, which needs Node 22 (E161).
        node-version: [18, 20, 22, 24]
        # One macOS leg (Node 24) confirms the bash gates + git plumbing behave on the
        # other POSIX target without paying for a full os×node cross-product. It is the slowest leg
        # (about 11 minutes), so it runs after a merge to main, nightly and by hand, not on a pull request
        # (#434). The cost: a macOS-only bug (like #462) is found right after the merge, not before it.
        # It is not a required check, so its name may change freely.
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[]' || '[{"os":"macos-latest","node-version":24}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false } # #426: no job here pushes; the tests must not find a token in .git/config

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm # #434: reuse the npm download cache, keyed on package-lock.json

      - name: Install dependencies
        run: npm ci

      # Bug net, not a style check (no formatter) — runs once on the canonical leg.
      - name: Lint
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 24
        run: npm run lint

      # The coverage leg skips this: `npm run coverage` runs every test file too and fails on a failing
      # test, so running both doubled the slowest leg (#427; release-check.sh does the same).
      - name: Test
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.node-version == 24) }}
        run: npm test

      # Threshold flags need Node >= 22.8 — gate on the 24 leg only. Floors, not targets:
      # raise them as coverage grows, never lower them to make a change pass.
      - name: Tests + coverage gate (lines >= 70%, branches >= 70%)
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 24
        run: npm run coverage

      - name: Pack smoke (tarball contents)
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 24
        run: |
          files=$(npm pack --dry-run --json | node -e "const f=JSON.parse(require('fs').readFileSync(0)).flatMap(x=>x.files.map(y=>y.path)); console.log(f.join('\n'))")
          echo "$files"
          for leak in .sdlc/ demo-repos/ epics/ cli/test.mjs cli/test-checks.mjs cli/test-threads.mjs cli/test-golden.mjs cli/test-migrate.mjs cli/test-hooks.mjs cli/test-detect.mjs cli/test-members.mjs cli/test-standup.mjs cli/test-fuzz.js cli/fixtures/; do
            # Escape regex metachars so the prefix match is literal (".sdlc/" must not match "asdlc/").
            if echo "$files" | grep -q "^${leak//./\\.}"; then echo "::error::tarball leaks $leak"; exit 1; fi
          done
          echo "$files" | grep -q '^bin/yad.mjs' || { echo "::error::bin missing"; exit 1; }
          echo "$files" | grep -q '^skills/' || { echo "::error::skills missing"; exit 1; }

  # Native Windows, no WSL (E113). Not the full suite: it drives bash gates and POSIX paths throughout.
  # This runs the file written for every OS — the Node hook scripts, run as `node hooks/<script>.mjs` the
  # way Claude Code and Cursor run them, and the Windows-facing CLI (CRLF checkouts, `.cmd` launchers,
  # `C:\` and `/c:/` paths, Git Bash detection). The checkout keeps the runner's default
  # `core.autocrlf=true`, so the scripts under test have CRLF line endings, as on a teammate's machine.
  windows:
    name: windows (hooks + CLI, node ${{ matrix.node-version }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # 18 is the oldest Node yadflow 4 still runs on (end of life: test-only); 24 is current.
        node-version: [18, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false } # #426: no job here pushes; the tests must not find a token in .git/config

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm # #434: reuse the npm download cache, keyed on package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Hook scripts and the Windows-facing CLI
        run: node --test cli/test-hooks.mjs cli/test-detect.mjs

  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        # macOS: after a merge, nightly and by hand only, as in the test job (#434). `e2e (ubuntu-latest)`
        # is a required check: keep that name.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false } # #426: no job here pushes; the tests must not find a token in .git/config

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No `cache: npm` here: this job never runs npm ci, so it would save a near-empty cache under the
          # key the test and audit jobs share — and, finishing first, block their full one (#434).

      # Packs the real tarball, installs it into a throwaway prefix, and drives the installed
      # binary through setup -> check -> gate open/sync -> commit -> check gates (pass + fail).
      - name: E2E against the packed tarball
        run: npm run test:e2e

      # The agent acceptance run's checks, with scripted agents (no credit, no login): a well-behaved run
      # must pass and a misbehaving one must be caught. The real run is opt-in (docs/agent-acceptance.md).
      - name: Agent acceptance checks (selftest)
        run: npm run test:agents:selftest

  # The Pages deploy (yad-docs.yml) builds these sites only after a merge, so a pull request that
  # breaks one was found only when the live site lost its page. Same Node as the deploy.
  docs-sites:
    name: docs sites (build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false } # #426: no job here pushes; the tests must not find a token in .git/config

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # the deploy's line: yad-docs.yml is built by `yad docs sync --wire`, which pins 22
          cache: npm # #434: one cache for both sites, keyed on both lockfiles
          cache-dependency-path: |
            docs/sdlc-site/package-lock.json
            docs/tutorial-site/package-lock.json

      # Lint as well (#434): the sites' eslint runs nowhere else, so a lint-breaking dependency bump
      # (#485, eslint 10) was found only by hand.
      - name: Lint + build the overview site
        working-directory: docs/sdlc-site
        run: npm ci && npm run lint && npm run build

      - name: Lint + build the tutorial site
        working-directory: docs/tutorial-site
        run: npm ci && npm run lint && npm run build

  audit:
    name: audit (dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false } # #426: no job here pushes; the tests must not find a token in .git/config

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm # #434: reuse the npm download cache, keyed on package-lock.json

      - name: Install dependencies
        run: npm ci

      # The runtime has ZERO production dependencies — this proves it stays that way.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify registry signatures
        run: npm audit signatures
