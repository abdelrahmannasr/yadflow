version: 2
updates:
  # The package and both docs sites (#429): each has its own lockfile. Minor and patch updates come as one
  # PR per folder; a major update still gets a PR of its own, since it may need code changes.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/docs/sdlc-site"
      - "/docs/tutorial-site"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps):"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"
    commit-message:
      prefix: "chore(ci):"
    # directory "/" reads every file in .github/workflows/, action-pins.yml included: the actions only a
    # CI template uses are listed there, so their bumps come here too (#429).
    #
    # Every github/codeql-action step in a workflow must run the same version, or the job fails.
    # One grouped PR bumps init, analyze and upload-sarif together.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
